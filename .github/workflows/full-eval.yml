# The FULL evaluation on YOUR Windows PC (a self-hosted runner): the same commands, in the same
# order, as the Evaluation section of README.md. One step per command.
# GitHub's own machines cannot run it: the PDFs are not in the repository, and qwen3:8b
# needs Ollama and many hours. Start it by hand: GitHub -> Actions -> full-eval -> Run workflow.
# Step 5 of the README (python eval.py --grade ...) asks y / p / n for each answer, so it
# cannot run here: run it yourself afterwards, then python eval.py --report.
name: full-eval

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Project folder on the PC (with raw_pdfs, vector_db and .venv)"
        default: 'C:\Users\Krishna\Desktop\RAG'
      answers:
        description: "Also run step 4, the slow answer runs (many hours)?"
        type: boolean
        default: true
      push_results:
        description: "Commit and push the new test results (test_result folder) to GitHub?"
        type: boolean
        default: true

jobs:
  eval:
    runs-on: [self-hosted, windows]
    timeout-minutes: 2880            # 48 hours
    defaults:
      run:
        shell: cmd
        working-directory: ${{ inputs.project_dir }}
    env:
      PY: .venv\Scripts\python.exe
      PYTHONIOENCODING: utf-8
    steps:
      - name: "0. Check Ollama is running with both models"
        run: |
          %PY% -c "import urllib.request; urllib.request.urlopen('http://localhost:11434', timeout=10); print('Ollama is running')" || (echo Ollama is NOT running: start Ollama on this PC. & exit /b 1)
          ollama list | findstr /c:"qwen3:8b" || (echo Model missing: ollama pull qwen3:8b & exit /b 1)
          ollama list | findstr /c:"nomic-embed-text" || (echo Model missing: ollama pull nomic-embed-text & exit /b 1)

      - name: "1. Checks: python -m pytest tests -q"
        run: "%PY% -m pytest tests -q"

      - name: "1. Checks: python check_lost_docs.py"
        run: "%PY% check_lost_docs.py"

      - name: "1. Checks: python check_corpus.py"
        run: "%PY% check_corpus.py"

      - name: "2. Floor: python eval.py --bm25-pages"
        run: "%PY% eval.py --bm25-pages"

      - name: "2. Floor: python eval.py --bm25-pages --test=qa_heldout.csv"
        run: "%PY% eval.py --bm25-pages --test=qa_heldout.csv"

      - name: "3. Retrieval only: python app.py --strategy=semantic"
        run: "%PY% app.py --strategy=semantic"

      - name: "3. Retrieval only: python eval.py --all --setups --retrieval-only"
        run: "%PY% eval.py --all --setups --retrieval-only"

      - name: "3. Retrieval only: python eval.py --all --setups --retrieval-only --test=qa_heldout.csv"
        run: "%PY% eval.py --all --setups --retrieval-only --test=qa_heldout.csv"

      - name: "4. Answers: python eval.py --strategy=recursive"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive"

      - name: "4. Answers: python eval.py --strategy=recursive --test=qa_heldout.csv"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --test=qa_heldout.csv"

      - name: "4. Answers: python eval.py --strategy=recursive --hybrid"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --hybrid"

      - name: "4. Answers: python eval.py --strategy=recursive --hybrid --test=qa_heldout.csv"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --hybrid --test=qa_heldout.csv"

      - name: "4. Answers: python eval.py --strategy=recursive --hybrid --test=qa_old_wording.csv"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --hybrid --test=qa_old_wording.csv"

      - name: "4. Answers: python eval.py --strategy=recursive --hybrid --rerank"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --hybrid --rerank"

      - name: "4. Answers: python eval.py --strategy=recursive --hybrid --rerank --test=qa_heldout.csv"
        if: ${{ inputs.answers }}
        run: "%PY% eval.py --strategy=recursive --hybrid --rerank --test=qa_heldout.csv"

      - name: "6. Report: python eval.py --report"
        if: ${{ always() }}
        run: "%PY% eval.py --report"

      - name: "7. Commit and push the test_result folder"
        if: ${{ !cancelled() && inputs.push_results }}
        run: |
          git add test_result
          git diff --cached --quiet && echo No new results to commit. && exit /b 0
          git commit -m "Update test results (full-eval run ${{ github.run_number }}) [skip ci]" || exit /b 1
          git push

      - name: "8. Download: the test_result folder"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: ${{ inputs.project_dir }}\test_result\